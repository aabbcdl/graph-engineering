name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run test:archive

  contract-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: npm run test:eval
      - run: npm run test:package-policy
      - run: npm run validate
      - run: npm run validate:package
      - run: npm run test:package-smoke
      - run: npm run release:check
      - run: git diff-tree --check --root --no-commit-id -r HEAD
